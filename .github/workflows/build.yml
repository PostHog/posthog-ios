name: Build
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-markdown-only:
    uses: PostHog/.github/.github/workflows/detect-markdown-only.yml@ec25337d9fae0100622cbfea1bd5bd88284ac10b
    permissions:
      pull-requests: read

  build:
    needs: detect-markdown-only
    runs-on: macos-15-xlarge
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            command: set -o pipefail && xcrun xcodebuild clean build -scheme PostHog -destination generic/platform=ios | xcpretty
          - platform: macos-spm
            command: set -o pipefail && xcrun swift build --arch arm64
          - platform: spm-no-traits
            command: make buildSdkSpmNoTraits buildTestsSpmTraitsIOS
          - platform: macos
            command: set -o pipefail && xcrun xcodebuild clean build -scheme PostHog -destination generic/platform=macos | xcpretty
          - platform: tvos
            command: set -o pipefail && xcrun xcodebuild clean build -scheme PostHog -destination generic/platform=tvos | xcpretty
          - platform: watchos
            command: set -o pipefail && xcrun xcodebuild clean build -scheme PostHog -destination generic/platform=watchos | xcpretty
          - platform: visionos
            command: set -o pipefail && xcrun xcodebuild clean build -scheme PostHog -destination generic/platform=xros | xcpretty
    name: Build SDK (${{ matrix.platform }})
    steps:
      - name: Complete markdown-only PR check
        if: needs.detect-markdown-only.outputs.markdown_only == 'true'
        run: echo "Only Markdown files changed; no additional work is required for this check."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        with:
          xcode-version: latest-stable
      - name: Build SDK (${{ matrix.platform }})
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        run: ${{ matrix.command }}

  public-api:
    needs: detect-markdown-only
    if: github.event_name == 'pull_request' && needs.detect-markdown-only.outputs.markdown_only != 'true'
    runs-on: macos-15
    name: Public API snapshot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Check public API snapshots (default build and package traits off)
        run: make apiCheck

  build-sdk-min-toolchain:
    needs: detect-markdown-only
    runs-on: macos-15-xlarge
    # The main ruleset requires this exact check name. Keep it free of toolchain versions so pin bumps don't rename it.
    name: Build SDK
    steps:
      - name: Complete markdown-only PR check
        if: needs.detect-markdown-only.outputs.markdown_only == 'true'
        run: echo "Only Markdown files changed; no additional work is required for this check."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        with:
          xcode-version: '26.0.1'
      - name: Print toolchain versions
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Build SDK via Swift Package Manager
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        run: make buildSdkSpm
      - name: Build SDK via Swift Package Manager with package traits off
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        run: make buildSdkSpmNoTraits

  # Release generates the SDK reference only after the PR merges, so check here that it still
  # generates with this PR's pending version. Stale docs/capabilities.json entries only fail
  # once the version reaches a new major, which a major changeset does.
  sdk-reference:
    needs: detect-markdown-only
    if: github.event_name == 'pull_request' && needs.detect-markdown-only.outputs.markdown_only != 'true'
    name: SDK reference
    # Same runner as release.yml's update-references, so DocC matches.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout sdk-specs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PostHog/sdk-specs
          path: .sdk-specs
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup

      # `changeset version` exits 1 when there's nothing to apply, so only run it when there is.
      - name: Apply the pending version
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            pnpm changeset version
            ./scripts/bump-version.sh "$(node -p "require('./package.json').version")"
          fi

      - name: Generate the reference
        run: python3 scripts/generate-markdown.py --sdk-specs .sdk-specs
