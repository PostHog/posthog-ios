[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  # Fails if two files differ only by letter case (e.g. Foo.swift and foo.swift).
  # Linux treats them as separate files, but macOS/Windows filesystems are
  # case-insensitive by default, so a checkout there would break or overwrite one.
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "check-xml" },
  { id = "check-yaml", args = ["--allow-multiple-documents"] },
  { id = "detect-private-key" },
]
