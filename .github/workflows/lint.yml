name: Lint
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-markdown-only:
    uses: PostHog/.github/.github/workflows/detect-markdown-only.yml@ec25337d9fae0100622cbfea1bd5bd88284ac10b
    permissions:
      pull-requests: read

  swiftformat:
    needs: detect-markdown-only
    name: SwiftFormat
    runs-on: macos-26
    steps:
      - name: Complete markdown-only PR check
        if: needs.detect-markdown-only.outputs.markdown_only == 'true'
        run: echo "Only Markdown files changed; no additional work is required for this check."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'

      # Runner images ship whatever SwiftFormat is current, and new releases add rules that fail
      # unchanged code, so pin the version .swiftformat is written for.
      - name: Install pinned SwiftFormat
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        env:
          SWIFTFORMAT_VERSION: 0.62.1
          SWIFTFORMAT_SHA256: 7cb1cb1fae04932047c7015441c543848e8e60e1572d808d080e0a1f1661114a
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          echo "$SWIFTFORMAT_SHA256  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          unzip -oq "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftformat/swiftformat" --version

      - name: Check formatting
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        run: make swiftFormatCheck

  swiftlint:
    needs: detect-markdown-only
    name: SwiftLint
    runs-on: macos-26
    steps:
      - name: Complete markdown-only PR check
        if: needs.detect-markdown-only.outputs.markdown_only == 'true'
        run: echo "Only Markdown files changed; no additional work is required for this check."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'

      - name: Run SwiftLint
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        run: make swiftLintCheck
