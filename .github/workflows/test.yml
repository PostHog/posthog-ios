name: Tests
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-markdown-only:
    uses: PostHog/.github/.github/workflows/detect-markdown-only.yml@ec25337d9fae0100622cbfea1bd5bd88284ac10b
    permissions:
      pull-requests: read

  test:
    needs: detect-markdown-only
    runs-on: macos-15
    steps:
      - name: Complete markdown-only PR check
        if: needs.detect-markdown-only.outputs.markdown_only == 'true'
        run: echo "Only Markdown files changed; no additional work is required for this check."
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        with:
          xcode-version: latest-stable
      - name: Cache SPM dependencies
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Test SDK
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        run: make test

  # `make test` runs `swift test` on macOS, which compiles out every `#if os(iOS)` block, so the
  # iOS-only suites (session replay, autocapture, tracing headers, crash reporting, etc.) never run
  # there. Run the iOS test target on a simulator so those suites are actually exercised in CI.
  test-ios-simulator:
    needs: detect-markdown-only
    runs-on: macos-15
    steps:
      - name: Complete markdown-only PR check
        if: needs.detect-markdown-only.outputs.markdown_only == 'true'
        run: echo "Only Markdown files changed; no additional work is required for this check."
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        with:
          xcode-version: latest-stable
      - name: Test SDK on iOS Simulator
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        # Retries (3 iterations) protect merges from transient simulator flakiness; the macOS `test`
        # job runs without retries, so a genuine flake still surfaces as a hard failure there.
        run: make testOniOSSimulator
      - name: Report flaky (retried) tests
        # Retries can hide flakiness by turning a transient red into green. Surface any test that only
        # passed after a retry so flakes get tracked and fixed instead of silently masked. Best-effort:
        # never fails the job.
        if: ${{ needs.detect-markdown-only.outputs.markdown_only != 'true' && (always()) }}
        run: |
          log=xcodebuild-ios.log
          [ -f "$log" ] || { echo "No build log found; skipping flake report."; exit 0; }
          # A test that has both a 'failed' and a 'passed' line was retried (flaky). Handle both the
          # Swift Testing format (✔ Test "name" passed) and the XCTest format (Test Case '-[…]' passed).
          passed=$( { grep -oE 'Test "[^"]+" passed' "$log" | sed -E 's/^Test "//; s/" passed$//'; \
                      grep -oE "Test Case '[^']+' passed" "$log" | sed -E "s/^Test Case '//; s/' passed$//"; } | sort -u)
          failed=$( { grep -oE 'Test "[^"]+" failed' "$log" | sed -E 's/^Test "//; s/" failed$//'; \
                      grep -oE "Test Case '[^']+' failed" "$log" | sed -E "s/^Test Case '//; s/' failed$//"; } | sort -u)
          flaky=$(comm -12 <(printf '%s\n' "$failed") <(printf '%s\n' "$passed") | grep -v '^$' || true)
          if [ -n "$flaky" ]; then
            { echo "### ⚠️ Flaky tests (passed only after a retry)"; echo; echo '```'; echo "$flaky"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Flaky tests detected (passed on retry); see the job summary."
          else
            echo "No flaky (retried) tests detected." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Golden-image masking regression. Any iPhone on the Makefile-pinned OS runtime renders
  # identically; on failure the heatmap PNGs upload as an artifact.
  mask-snapshots:
    name: Session replay masking snapshots
    needs: detect-markdown-only
    runs-on: macos-15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Complete markdown-only PR check
        if: needs.detect-markdown-only.outputs.markdown_only == 'true'
        run: echo "Only Markdown files changed; no additional work is required for this check."
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        with:
          xcode-version: latest-stable
      - name: Verify masking goldens
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        run: make maskSnapshots
      - name: Upload diff images on failure
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        id: diff-upload
        if: failure() && needs.detect-markdown-only.outputs.markdown_only != 'true'
        with:
          name: mask-snapshot-diffs
          path: PostHogTests/__MaskSnapshotFailures__/*.png
          if-no-files-found: ignore

      # GitHub never renders artifacts on the PR page, so surface a download link there.
      # Looked up on every non-cancelled run so the success branch can clear a stale link.
      # Skipped on fork PRs: their tokens are read-only, so the comment write would fail.
      - name: Find existing mask-diff comment
        if: ${{ !cancelled() && needs.detect-markdown-only.outputs.markdown_only != 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-mask-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- mask-snapshot-diffs -->"
      # Snapshot mismatch: diff PNGs exist, so link the artifact.
      - name: Post mask-diff artifact link
        if: ${{ failure() && needs.detect-markdown-only.outputs.markdown_only != 'true' && github.event.pull_request.head.repo.full_name == github.repository && steps.diff-upload.outputs.artifact-id != '' }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-mask-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- mask-snapshot-diffs -->
            ### ⚠️ Session replay mask snapshots

            The rendered masking output no longer matches the committed goldens, so a mask has moved, grown, shrunk, or disappeared. That's either a real regression or an intended masking change that needs the goldens refreshed.

            **[Download the diff artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.diff-upload.outputs.artifact-id }})** — per failing case: `expected` (committed golden), `actual` (this run), `diff` (heatmap of changed pixels).

            If the change is intended, refresh with `make recordMaskSnapshots` and commit the updated PNGs.
          edit-mode: replace
      # Job failed before rendering snapshots (build/simulator/infra): no artifact to link,
      # but still flag the red on the PR rather than going silent.
      - name: Post mask-diff build failure notice
        if: ${{ failure() && needs.detect-markdown-only.outputs.markdown_only != 'true' && github.event.pull_request.head.repo.full_name == github.repository && steps.diff-upload.outputs.artifact-id == '' }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-mask-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- mask-snapshot-diffs -->
            ### ⚠️ Session replay mask snapshots

            The masking snapshot job failed before rendering any snapshots (build, simulator, or infrastructure failure), so there are no diff images to compare. See the [run logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the failure.
          edit-mode: replace
      # Goldens match again: drop the stale divergence comment so a green PR reads clean.
      - name: Clear mask-diff comment on success
        if: ${{ success() && needs.detect-markdown-only.outputs.markdown_only != 'true' && github.event.pull_request.head.repo.full_name == github.repository && steps.find-mask-comment.outputs.comment-id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ steps.find-mask-comment.outputs.comment-id }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$COMMENT_ID"

  downgrade-compatibility:
    needs: detect-markdown-only
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        downgrade_ref:
          # Pin persisted-storage schema boundaries rather than the last N releases.
          # 3.48.0 force-parsed queue filenames as Doubles during startup.
          - 3.48.0
          # 3.48.3 introduced the UUID event queue folder.
          - 3.48.3
          # 3.58.0 introduced the persisted logs queue.
          - 3.58.0
    name: Downgrade compatibility (${{ matrix.downgrade_ref }})
    steps:
      - name: Complete markdown-only PR check
        if: needs.detect-markdown-only.outputs.markdown_only == 'true'
        run: echo "Only Markdown files changed; no additional work is required for this check."
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        with:
          xcode-version: latest-stable
      - name: Test downgrade compatibility
        if: needs.detect-markdown-only.outputs.markdown_only != 'true'
        env:
          DOWNGRADE_REF: ${{ matrix.downgrade_ref }}
        run: make testDowngradeCompatibility
